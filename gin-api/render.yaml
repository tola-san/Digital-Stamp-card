services:
  - type: web
    runtime: go
    name: digital-stamp-api
    region: singapore
    plan: free
    buildCommand: go build -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-stamp-db
          databaseName: digital_stamp
          property: connectionString
      - key: FRONTEND_URL
        sync: false

databases:
  - name: digital-stamp-db
    region: singapore
    plan: free
    databaseName: digital_stamp
    user: digital_stamp_user
    postgresMajorVersion: "17"
