


# Local development only. Production uses the Render API with Aiven MySQL.
services:
  api:
    build: .
    container_name: digital-stamp-api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: mysql://app:app@db:3306/digital_stamp?ssl-mode=DISABLED
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
  
  # database config
  db:
    image: mysql:8.4
    container_name: digital-stamp-db
    restart: unless-stopped
    environment:
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_DATABASE: digital_stamp
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uapp -papp --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
