


# Local development only. Render deploys the API and Postgres as separate managed services.
services:
  api:
    build: .
    container_name: digital-stamp-api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@db:5432/digital_stamp?sslmode=disable
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
  
  # database config
  db:
    image: postgres:17-alpine
    container_name: digital-stamp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_stamp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_stamp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
